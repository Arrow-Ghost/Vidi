services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Only needed starting with the Memory segment (Segment 16). Not required
  # for the Segment 1 acceptance test — run with `docker compose --profile full up`.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vidi
      POSTGRES_PASSWORD: vidi
      POSTGRES_DB: vidi
    ports:
      - "5432:5432"
    volumes:
      - vidi_pg_data:/var/lib/postgresql/data
    profiles: ["full"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["full"]

volumes:
  vidi_pg_data:
